<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PromptCraft — Timer System</title>
  <link rel="stylesheet" href="timer.css"/>
</head>
<body>

  <!-- TOP NAVBAR -->
  <header class="navbar">
    <div class="navbar-left">⚡ PROMPTCRAFT</div>
    <div class="navbar-center">Level <span id="level-num">1</span></div>
    <div class="navbar-right">Score: <span id="score-val">0</span></div>
  </header>

  <!-- MAIN PANEL (Timer feature only) -->
  <main class="board">

    <section class="panel timer-panel">
      <h2 class="panel-title">Timer</h2>

      <div class="timer-display-wrap">
        <div class="timer-number" id="timer">60</div>
        <div class="timer-unit">seconds</div>
      </div>

      <div class="timer-controls">
        <button class="btn btn-primary" id="btn-start">Start</button>
        <button class="btn btn-outline" id="btn-pause">Pause</button>
        <button class="btn btn-ghost" id="btn-reset">Reset</button>
      </div>

      <div class="timer-status" id="timer-status">Ready</div>
    </section>

  </main>

  <!-- TIME UP MODAL -->
  <div class="modal-overlay" id="overlay">
    <div class="modal-card">
      <div class="modal-title">TIME UP!</div>
      <div class="modal-sub">Correct Prompt:</div>
      <div class="modal-prompt" id="correct-prompt">neon cyberpunk cat on giant donut in space</div>
      <div class="modal-btns">
        <button class="btn btn-primary" id="btn-play-again">Play Again</button>
        <button class="btn btn-outline" id="btn-next-level">Next Level</button>
      </div>
    </div>
  </div>

  <script src="timer.js"></script>
</body>
</html>
